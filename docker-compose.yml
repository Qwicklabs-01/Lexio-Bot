version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: omni_telegram_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot-server:
    build: .
    container_name: omni_bot_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/omni_telegram_platform?schema=public
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      ADMIN_IDS: ${ADMIN_IDS}
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN}
      MINI_APP_URL: ${MINI_APP_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"

volumes:
  pgdata:
