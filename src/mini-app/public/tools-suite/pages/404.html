<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Universal Studio</title>

<body style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">

        <h2 style="font-size: 2rem; margin-bottom: 2rem;">Oops! This page is lost in the matrix.</h2>
        <p style="color: var(--text-muted); margin-bottom: 3rem; font-size: 1.25rem;">The tool you are looking for might have been moved or renamed.</p>
        <a href="../index.html" class="btn-primary" style="padding: 1rem 3rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; text-decoration: none; font-weight: 700; font-size: 1.1rem; display: inline-block; box-shadow: var(--shadow);">Back to Safety</a>

    <script src="../js/main.js"></script>
