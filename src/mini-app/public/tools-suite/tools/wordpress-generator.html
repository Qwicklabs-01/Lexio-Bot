<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress Theme Generator - Universal Studio</title>
    <meta name="description" content="Kickstart your next WordPress project with a clean, standards-compliant starter theme.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>WordPress Theme Generator</h1>
            <p>Kickstart your next WordPress project with a clean, standards-compliant starter theme.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <form id="wpForm" class="generator-form">
                    <div class="form-group">
                        <label>Theme Name</label>
                        <input type="text" id="wpName" placeholder="My Awesome Theme" value="ForgeTheme">
                    </div>
                    <div class="form-group">
                        <label>Author Name</label>
                        <input type="text" id="wpAuthor" placeholder="Your Name" value="Universal Studio User">
                    </div>
                    <div class="form-group">
                        <label>Primary Brand Color</label>
                        <input type="color" id="wpColor" value="#6366f1">
                    </div>
                    <div class="form-group">
                        <label>Version</label>
                        <input type="text" id="wpVersion" value="1.0.0">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Description</label>
                        <input type="text" id="wpDesc" placeholder="Briefly describe your theme...">
                    </div>
                </form>

                <div style="margin-top: 2rem;">
                    <button class="btn-primary" id="generateWp" style="width: 100%; padding: 1.25rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Generate & Download ZIP</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('generateWp').onclick = async () => {
            const btn = document.getElementById('generateWp');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Packaging Theme...';

            const name = document.getElementById('wpName').value;
            const author = document.getElementById('wpAuthor').value;
            const version = document.getElementById('wpVersion').value;
            const color = document.getElementById('wpColor').value;
            const desc = document.getElementById('wpDesc').value || "A custom WordPress theme generated by Universal Studio.";

            const zip = new JSZip();
            const folder = zip.folder(name.toLowerCase().replace(/\s+/g, '-'));

            // style.css
            const style = `/*
Theme Name: ${name}
Theme URI: https://toolforge.com
Author: ${author}
Description: ${desc}
Version: ${version}
License: GNU General Public License v2 or later
Text Domain: ${name.toLowerCase()}
*/

:root { --primary-color: ${color}; }
body { font-family: sans-serif; }`;

            folder.file("style.css", style);
            folder.file("index.php", "<?php get_header(); ?>\n<main>\n<h1>Welcome to " + name + "</h1>\n</main>\n<?php get_footer(); ?>");
            folder.file("functions.php", "<?php \nfunction " + name.toLowerCase() + "_setup() {\n  add_theme_support('title-tag');\n}\nadd_action('after_setup_theme', '" + name.toLowerCase() + "_setup');");

            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = name + ".zip";
            link.click();

            btn.disabled = false;
            btn.innerHTML = 'Generate & Download ZIP';
        };
    </script>
</body>
</html>
