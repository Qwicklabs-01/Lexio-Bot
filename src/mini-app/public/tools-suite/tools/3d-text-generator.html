<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Text Generator - Universal Studio</title>
    <meta name="description" content="Create high-impact cinematic typography with depth and architectural perspective.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>3D Text Generator</h1>
            <p>Create high-impact cinematic typography with depth and architectural perspective.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="td-preview-container">
                    <div id="tdText">UNIVERSAL STUDIO</div>
                </div>

                <div class="controls" style="display: grid; gap: 1.5rem;">
                    <input type="text" id="inputText" value="UNIVERSAL STUDIO" style="width: 100%; padding: 1rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem; font-size: 1.25rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Extrusion Depth</label>
                        <input type="range" id="depth" min="1" max="20" value="8">
                    </div>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const text = document.getElementById('tdText');
        const input = document.getElementById('inputText');
        const depthInput = document.getElementById('depth');

        function update3D() {
            const d = depthInput.value;
            text.textContent = input.value;
            
            let shadows = [];
            for (let i = 1; i <= d; i++) {
                shadows.push(`${-i}px ${i}px 0px #ccc`);
            }
            shadows.push(`${-d-2}px ${d+2}px 20px rgba(0,0,0,0.5)`);
            
            text.style.textShadow = shadows.join(', ');
        }

        input.oninput = update3D;
        depthInput.oninput = update3D;
        update3D();
    </script>
</body>
</html>
