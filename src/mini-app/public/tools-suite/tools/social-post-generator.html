<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Post Generator - Universal Studio</title>
    <meta name="description" content="Beat the algorithm. Generate high-engagement posts and captions for any platform instantly.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Social Post Generator</h1>
            <p>Beat the algorithm. Generate high-engagement posts and captions for any platform instantly.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div style="background: var(--surface); padding: 2rem; border-radius: 1rem; border: 1px solid var(--border); margin-bottom: 2rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 700;">What is your post about?</label>
                    <textarea id="topic" placeholder="e.g. My new coffee shop opening in London" style="width: 100%; height: 100px; padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: none;"></textarea>
                </div>

                <div id="result" style="display: none; background: #eef2ff; color: #3730a3; padding: 2rem; border-radius: 1rem; border: 1px solid #c7d2fe; margin-bottom: 2rem; white-space: pre-wrap; font-weight: 500;">
                    <!-- Result comes here -->
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button class="btn-primary" id="genBtn" style="flex: 1; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Generate Post</button>
                    <select id="platform" style="padding: 1rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem;">
                        <option value="ig">Instagram</option>
                        <option value="tw">Twitter / X</option>
                        <option value="li">LinkedIn</option>
                    </select>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('genBtn');
        const res = document.getElementById('result');
        const topicIn = document.getElementById('topic');
        const platIn = document.getElementById('platform');

        btn.onclick = () => {
            const topic = topicIn.value || "my project";
            const plat = platIn.value;
            res.style.display = 'block';
            
            if(plat === 'ig') {
                res.textContent = `âœ¨ Big news! Just launched ${topic}. \n\nI've been working on this for a while and I'm so excited to share it with you all. \n\nCheck it out at the link in bio! ðŸš€\n\n#launch #newproject #entrepreneur #instadaily`;
            } else if(plat === 'tw') {
                res.textContent = `Excited to announce ${topic} is LIVE! ðŸš€ \n\nIt solves the biggest problem in my workflow and I think you'll love it too. \n\nCheck it out here: toolforge.com \n\n#socialmedia #tech #launch`;
            } else {
                res.textContent = `I am thrilled to announce the launch of ${topic}! ðŸš€\n\nThis journey has been a testament to the power of perseverance and innovation. By focusing on local-first processing, we are redefining privacy in the tool space.\n\n#Leadership #Innovation #DataPrivacy`;
            }
        };
    </script>
</body>
</html>
