<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Generator - Universal Studio</title>
    <meta name="description" content="Create soft, tactile UI elements that appear to emerge from their background.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Neumorphism Generator</h1>
            <p>Create soft, tactile UI elements that appear to emerge from their background.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div id="neoPreview" style="background: #e0e0e0; padding: 6rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;">
                    <div id="neoBox" style="width: 150px; height: 150px; background: #e0e0e0; border-radius: 2rem;"></div>
                </div>

                <div class="controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem;">Shadow Distance</label>
                        <input type="range" id="distance" min="0" max="50" value="20" style="width: 100%;">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem;">Intensity</label>
                        <input type="range" id="intensity" min="0" max="100" value="15" style="width: 100%;">
                    </div>
                </div>

                <div class="css-output" style="margin-top: 2rem; background: var(--surface); padding: 1.5rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                    <code id="cssCode">/* Soft UI Logic */</code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const box = document.getElementById('neoBox');
        const distInput = document.getElementById('distance');
        const intInput = document.getElementById('intensity');
        const codeOut = document.getElementById('cssCode');

        function updateNeo() {
            const dist = distInput.value;
            const blur = dist * 2;
            const style = `
background: #e0e0e0;
border-radius: 2rem;
box-shadow: ${dist}px ${dist}px ${blur}px #bebebe,
           -${dist}px -${dist}px ${blur}px #ffffff;`;
            
            box.style.boxShadow = `${dist}px ${dist}px ${blur}px #bebebe, -${dist}px -${dist}px ${blur}px #ffffff`;
            codeOut.innerHTML = style.replace(/\n/g, '<br>');
        }

        distInput.oninput = updateNeo;
        updateNeo();
    </script>
</body>
</html>
