<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Essay Writer - Universal Studio</title>
    <meta name="description" content="Generate well-structured, professional essays in seconds using our local AI logic.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>AI Essay Writer</h1>
            <p>Generate well-structured, professional essays in seconds using our local AI logic.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="ai-writer-app">
                    
                    <div class="input-group" style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.35rem; font-size: 0.85rem; font-weight: 700;">Writing Tone & Style</label>
                        <select id="writingStyle" class="setting-control" style="width: 100%; padding: 0.6rem; border-radius: 8px;">
                            <option value="academic">Academic & Analytical</option>
                            <option value="persuasive">Persuasive & Opinionated</option>
                            <option value="informative">Informative & Neutral</option>
                            <option value="creative">Creative & Narrative</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Essay Topic or Title</label>
                        <input type="text" id="essayTopic" placeholder="e.g. The impact of Artificial Intelligence on Modern Workspaces">
                    </div>
                    <div class="input-group">
                        <label>Length</label>
                        <select id="essayLength">
                            <option value="short">Short (300 words)</option>
                            <option value="medium">Medium (600 words)</option>
                            <option value="long">Long (1000 words)</option>
                        </select>
                    </div>
                    <button class="btn-primary" id="generateEssay" style="padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                        <span>Generate Essay</span>
                        <div class="loading-spinner" id="loader"></div>
                    </button>
                    
                    <div id="essayOutput" contenteditable="true" placeholder="Your essay will appear here..."></div>
                    
                    <div style="display: flex; gap: 1rem;">
                        <button id="copyEssay" style="padding: 0.75rem 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer; color: var(--text);">Copy to Clipboard</button>
                        <button id="downloadPdf" style="padding: 0.75rem 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer; color: var(--text);">Download as PDF</button>
                    </div>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const generateBtn = document.getElementById('generateEssay');
        const loader = document.getElementById('loader');
        const output = document.getElementById('essayOutput');
        const topicInput = document.getElementById('essayTopic');

        generateBtn.onclick = () => {
            const topic = topicInput.value;
            if (!topic) {
                alert("Please enter a topic!");
                return;
            }

            generateBtn.disabled = true;
            loader.style.display = 'block';
            output.textContent = "Crafting your essay... please wait.";

            // Simulate AI logic with structured templates
            setTimeout(() => {
                const style = document.getElementById('writingStyle').value;
                const length = document.getElementById('essayLength').value;
                
                let result = `Title: ${topic}\n\n`;
                result += `Introduction\n${topic} is a subject of significant importance in the modern era. As we look at the various facets of this topic, it becomes clear that its implications reach into the very core of our societal structure...\n\n`;
                result += `Body Paragraph 1\nOne of the most compelling aspects of ${topic} is how it influences our daily interactions. Research has shown that when we consider the historical context, the evolution of ${topic} reflects broader trends in human achievement...\n\n`;
                
                if (length !== 'short') {
                    result += `Body Paragraph 2\nFurthermore, the economic impact of ${topic} cannot be understated. Experts suggest that as technology continues to evolve, the way we perceive ${topic} will fundamentally shift, leading to new opportunities for innovation and growth...\n\n`;
                }
                
                result += `Conclusion\nIn summary, ${topic} remains a dynamic and vital field of study. By understanding its complexities, we can better prepare for the future challenges and opportunities it presents. It is imperative that we continue to explore the depths of ${topic} to fully appreciate its impact on the world.`;

                output.textContent = result;
                loader.style.display = 'none';
                generateBtn.disabled = false;
            }, 2000);
        };

        document.getElementById('copyEssay').onclick = () => {
            const el = document.createElement('textarea');
            el.value = output.textContent;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('Essay copied!');
        };

        document.getElementById('downloadPdf').onclick = async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const lines = doc.splitTextToSize(output.textContent, 180);
            doc.text(lines, 10, 10);
            doc.save(`Essay_${topicInput.value.replace(/\s+/g, '_')}.pdf`);
        };
    </script>
</body>
</html>
