<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Downloader - Universal Studio</title>
    <meta name="description" content="Save your favorite moments. Extract HD videos from major social platforms with zero data tracking.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Social Video Downloader</h1>
            <p>Save your favorite moments. Extract HD videos from major social platforms with zero data tracking.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass" style="padding: 2.5rem;">
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <input type="text" id="vUrl" placeholder="Paste social media video link here..." style="flex: 1; padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1.1rem;">
                    <button class="btn-premium" id="fetchBtn">Fetch Video</button>
                </div>

                <div id="uProcess" class="loader-wrapper" style="display: none;">
                    <div class="loader-ring"></div>
                    <p>Analyzing media stream...</p>
                </div>

                <div id="uResult" style="display: none; text-align: center; background: var(--surface); padding: 2rem; border-radius: 1rem; border: 1px solid var(--border);">
                    <div style="width: 100%; height: 200px; background: #eee; border-radius: 0.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-play-circle" style="font-size: 4rem; color: #ccc;"></i>
                    </div>
                    <h3>Video Found (1080p)</h3>
                    <button class="btn-premium" style="margin-top: 1.5rem;">Download MP4</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('fetchBtn');
        const process = document.getElementById('uProcess');
        const result = document.getElementById('uResult');

        btn.onclick = () => {
            if(!document.getElementById('vUrl').value) return;
            process.style.display = 'flex';
            result.style.display = 'none';
            setTimeout(() => {
                process.style.display = 'none';
                result.style.display = 'block';
            }, 3000);
        };
    </script>
</body>
</html>
