<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Gradient Generator - Universal Studio</title>
    <meta name="description" content="Design complex, organic color blends that bring life and modern energy to your backgrounds.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Mesh Gradient Generator</h1>
            <p>Design complex, organic color blends that bring life and modern energy to your backgrounds.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div id="meshPreview">
                    <div class="mesh-dot" id="dot1" style="background: #ff9a9e; top: -50px; left: -50px;"></div>
                    <div class="mesh-dot" id="dot2" style="background: #fecfef; top: 150px; right: -50px;"></div>
                    <div class="mesh-dot" id="dot3" style="background: #a1c4fd; bottom: -50px; left: 100px;"></div>
                </div>

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn-primary" id="randomizeBtn" style="padding: 1rem 2rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Randomize Blend</button>
                    <button class="btn-primary" style="padding: 1rem 2rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer;">Export SVG</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const colors = ['#f87171', '#fb923c', '#fbbf24', '#facc15', '#a3e635', '#4ade80', '#34d399', '#2dd4bf', '#22d3ee', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#c084fc', '#e879f9', '#f472b6', '#fb7185'];
        
        function rnd(min, max) { return Math.floor(Math.random() * (max - min) + min); }
        function rndColor() { return colors[rnd(0, colors.length)]; }

        document.getElementById('randomizeBtn').onclick = () => {
            const dots = document.querySelectorAll('.mesh-dot');
            dots.forEach(dot => {
                dot.style.background = rndColor();
                dot.style.top = rnd(-100, 300) + 'px';
                dot.style.left = rnd(-100, 300) + 'px';
                dot.style.width = rnd(200, 500) + 'px';
                dot.style.height = rnd(200, 500) + 'px';
                dot.style.filter = `blur(${rnd(60, 120)}px)`;
            });
        };
    </script>
</body>
</html>
