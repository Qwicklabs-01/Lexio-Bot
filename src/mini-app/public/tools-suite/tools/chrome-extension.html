<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Extension Generator - Universal Studio</title>
    <meta name="description" content="Turn your ideas into browser actions. Instant boilerplate generation for developers.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Chrome Extension Generator</h1>
            <p>Turn your ideas into browser actions. Instant boilerplate generation for developers.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="form-group">
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700;">Extension Name</label>
                        <input type="text" id="extName" placeholder="My Productivity Tool" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--text);">
                    </div>
                    <div class="form-group">
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700;">Extension Description</label>
                        <textarea id="extDesc" placeholder="Describe what your extension does..." style="width: 100%; height: 100px; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--text); resize: none;"></textarea>
                    </div>
                    <div class="form-group">
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700;">Action Type</label>
                        <select id="extAction" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--bg); color: var(--text);">
                            <option value="popup">Browser Action (Popup UI)</option>
                            <option value="background">Background Action (Scripts only)</option>
                            <option value="content">Content Script (Injects into pages)</option>
                        </select>
                    </div>
                    <button class="btn-primary" id="generateExt" style="padding: 1.25rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Generate Extension Boilerplate (.ZIP)</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.getElementById('generateExt').onclick = async () => {
            const name = document.getElementById('extName').value || "MyExtension";
            const desc = document.getElementById('extDesc').value || "A custom extension created via Universal Studio.";
            const type = document.getElementById('extAction').value;

            const zip = new JSZip();
            const folder = zip.folder(name.toLowerCase().replace(/\s+/g, '-'));

            const manifest = {
                "manifest_version": 3,
                "name": name,
                "description": desc,
                "version": "1.0",
                "action": {
                    "default_popup": "popup.html"
                }
            };

            if(type === 'background') {
                manifest.background = { "service_worker": "background.js" };
                folder.file("background.js", "// Background service worker logic goes here\nconsole.log('Background worker active.');");
            }

            folder.file("manifest.json", JSON.stringify(manifest, null, 2));
            folder.file("popup.html", `<!DOCTYPE html><html><body><h1>${name}</h1><p>${desc}</p></body></html>`);

            const content = await zip.generateAsync({type:"blob"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = name + "_ChromeExt.zip";
            link.click();
        };
    </script>
</body>
</html>
