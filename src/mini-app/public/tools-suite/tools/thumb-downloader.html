<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Thumbnail Downloader - Universal Studio</title>
    <meta name="description" content="Visual inspiration. Extract the highest resolution thumbnail from any YouTube video instantly.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>YouTube Thumbnail Downloader</h1>
            <p>Visual inspiration. Extract the highest resolution thumbnail from any YouTube video instantly.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass" style="padding: 2.5rem;">
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <input type="text" id="ytUrl" placeholder="Paste YouTube Video URL here..." style="flex: 1; padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg); color: var(--text);">
                    <button class="btn-premium" id="extractBtn">Extract HD</button>
                </div>

                <div id="uProcess" class="loader-wrapper" style="display: none;">
                    <div class="loader-ring"></div>
                    <p>Fetching media assets...</p>
                </div>

                <div id="uResult" style="display: none; text-align: center;">
                    <div style="width: 100%; height: 300px; background: #eee; border-radius: 1rem; margin-bottom: 1.5rem; overflow: hidden; border: 1px solid var(--border);">
                        <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&q=80&w=1000" style="width: 100%; height: 100%; object-fit: cover;" alt="Thumbnail Preview">
                    </div>
                    <button class="btn-premium">Download MaxRes (1280x720)</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('extractBtn');
        const process = document.getElementById('uProcess');
        const result = document.getElementById('uResult');

        btn.onclick = () => {
            if(!document.getElementById('ytUrl').value) return;
            process.style.display = 'flex';
            result.style.display = 'none';
            setTimeout(() => {
                process.style.display = 'none';
                result.style.display = 'block';
            }, 2500);
        };
    </script>
</body>
</html>
