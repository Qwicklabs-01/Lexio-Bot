<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSD Brush Generator - Universal Studio</title>
    <meta name="description" content="Design custom brush tips and textures to expand your Photoshop creative library.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>PSD Brush Generator</h1>
            <p>Design custom brush tips and textures to expand your Photoshop creative library.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="brush-canvas-area" id="canvasContainer">
                    <canvas id="brushCanvas" width="256" height="256"></canvas>
                </div>

                <div class="brush-settings">
                    <div class="setting-item">
                        <label>Brush Hardness</label>
                        <input type="range" id="hardness" min="1" max="100" value="50" style="width: 100%;">
                    </div>
                    <div class="setting-item">
                        <label>Tip Scatter</label>
                        <input type="range" id="scatter" min="0" max="100" value="0" style="width: 100%;">
                    </div>
                    <div class="setting-item">
                        <label>Brush Opacity</label>
                        <input type="range" id="opacity" min="10" max="100" value="100" style="width: 100%;">
                    </div>
                    <div class="setting-item">
                        <label>Brush Shape</label>
                        <select id="shape" style="width:100%; padding: 0.5rem; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
                            <option value="circle">Circular</option>
                            <option value="square">Square</option>
                            <option value="star">Star</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button class="btn-primary" id="clearBtn" style="padding: 0.75rem 1.5rem; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer;">Clear Canvas</button>
                    <button class="btn-primary" id="downloadBrush" style="flex: 1; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer;">Export Brush Tip (.PNG)</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const canvas = document.getElementById('brushCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.onmousedown = (e) => { painting = true; draw(e); };
        canvas.onmousemove = (e) => { if(painting) draw(e); };
        canvas.onmouseup = () => painting = false;

        function draw(e) {
            const pos = getPos(e);
            const hardness = document.getElementById('hardness').value / 100;
            const size = 20;
            const opacity = document.getElementById('opacity').value / 100;
            const shape = document.getElementById('shape').value;

            ctx.globalAlpha = opacity;
            ctx.fillStyle = 'black';

            if(shape === 'circle') {
                const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, size);
                grad.addColorStop(0, 'rgba(0,0,0,1)');
                grad.addColorStop(hardness, 'rgba(0,0,0,1)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
                ctx.fill();
            } else if(shape === 'square') {
                ctx.fillRect(pos.x - size/2, pos.y - size/2, size, size);
            } else {
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y - size);
                ctx.lineTo(pos.x + size, pos.y + size);
                ctx.lineTo(pos.x - size, pos.y + size);
                ctx.closePath();
                ctx.fill();
            }
        }

        document.getElementById('clearBtn').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('downloadBrush').onclick = () => {
            const link = document.createElement('a');
            link.download = 'psd-brush-tip.png';
            link.href = canvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
