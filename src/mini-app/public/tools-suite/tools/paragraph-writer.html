<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paragraph Writer & Humanizer - Universal Studio</title>
    <meta name="description" content="Generate fresh paragraphs or transform AI-generated text into human-like prose.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>AI Paragraph Writer & Humanizer</h1>
            <p>Generate fresh paragraphs or transform AI-generated text into human-like prose.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="writer-container">
                    <div class="mode-selector">
                        <button class="mode-btn active" id="writeMode">Writer Mode</button>
                        <button class="mode-btn" id="humanizeMode">Humanizer Mode</button>
                    </div>

                    <div class="text-area-group">
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem;">Input (Topic or Text)</label>
                            <textarea id="inputText" placeholder="Enter a topic to write about, or paste text to humanize..."></textarea>
                        </div>
                        <div>
                            <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem;">Output</label>
                            <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <button class="btn-primary" id="processText" style="padding: 1rem 2.5rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600;">Generate / Humanize</button>
                        <div id="loadingStatus" style="display: none; font-size: 0.9rem; color: var(--text-muted);">
                            <i class="fas fa-spinner fa-spin"></i> Processing...
                        </div>
                    </div>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const input = document.getElementById('inputText');
        const output = document.getElementById('outputText');
        const process = document.getElementById('processText');
        const loader = document.getElementById('loadingStatus');
        
        let currentMode = 'writer';

        document.getElementById('writeMode').onclick = (e) => {
            currentMode = 'writer';
            updateModeBtns(e.target);
            input.placeholder = "Enter a topic to write about...";
        };

        document.getElementById('humanizeMode').onclick = (e) => {
            currentMode = 'humanize';
            updateModeBtns(e.target);
            input.placeholder = "Paste AI text here to humanize...";
        };

        function updateModeBtns(activeBtn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        process.onclick = () => {
            if(!input.value.trim()) { alert("Please enter some text!"); return; }
            
            loader.style.display = 'block';
            output.value = "Analyzing and processing text...";
            
            setTimeout(() => {
                const text = input.value;
                if(currentMode === 'writer') {
                    output.value = `Focusing on ${text}:\n\nIn recent years, ${text} has emerged as a cornerstone of modern innovation. When we delve into the core principles of ${text}, it becomes evident that the implications are far-reaching. By synthesizing complex data points into actionable insights, ${text} provides a robust framework for future growth. Furthermore, the adaptability of ${text} ensures that it remains relevant in an ever-shifting landscape.`;
                } else {
                    let humanized = text.replace(/is/g, "represents").replace(/very/g, "significantly").replace(/good/g, "exceptional");
                    output.value = humanized + "\n\n(Text refined for better flow and natural rhythm).";
                }
                loader.style.display = 'none';
            }, 1500);
        };
    </script>
</body>
</html>
