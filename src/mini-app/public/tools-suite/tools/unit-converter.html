<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Universal Studio</title>
    <meta name="description" content="Switch between metric and imperial units effortlessly. Accurate conversions for length, mass, and more.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Unit Converter</h1>
            <p>Switch between metric and imperial units effortlessly. Accurate conversions for length, mass, and more.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass" style="max-width: 800px; margin: 0 auto;">
                <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 2rem; align-items: center;">
                    <div class="conversion-block">
                        <label style="display: block; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Source Value</label>
                        <input type="number" id="v1" value="1" placeholder="0.00" style="margin: 0; font-size: 1.5rem; font-weight: 700; padding: 1.5rem;">
                        <select id="u1" style="margin-top: 1rem;">
                            <option value="km">Kilometers (km)</option>
                            <option value="m">Meters (m)</option>
                            <option value="mi">Miles (mi)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                    
                    <div style="text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <div style="width: 50px; height: 50px; background: var(--primary-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                    </div>

                    <div class="conversion-block">
                        <label style="display: block; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;">Resulting Value</label>
                        <input type="number" id="v2" readonly style="margin: 0; font-size: 1.5rem; font-weight: 700; padding: 1.5rem; background: var(--surface-hover); border-color: var(--primary);">
                        <select id="u2" style="margin-top: 1rem;">
                            <option value="m">Meters (m)</option>
                            <option value="km">Kilometers (km)</option>
                            <option value="mi">Miles (mi)</option>
                            <option value="ft">Feet (ft)</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); display: flex; justify-content: center;">
                    <button class="btn-primary" id="copyBtn"><i class="fas fa-copy"></i> Copy Result</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');
        const u1 = document.getElementById('u1');
        const u2 = document.getElementById('u2');
        const copyBtn = document.getElementById('copyBtn');

        const factors = {
            km: 1000,
            m: 1,
            mi: 1609.34,
            ft: 0.3048
        };

        function calc() {
            const meters = v1.value * factors[u1.value];
            v2.value = (meters / factors[u2.value]).toFixed(4).replace(/\.?0+$/, '');
        }

        v1.oninput = calc;
        u1.onchange = calc;
        u2.onchange = calc;
        
        copyBtn.onclick = () => {
            v2.select();
            document.execCommand('copy');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy Result', 2000);
        };

        calc();
    </script>
</body>
</html>
