<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Improver - Universal Studio</title>
    <meta name="description" content="Elevate your writing. Transform dull sentences into sophisticated, professional copy.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Content Improver</h1>
            <p>Elevate your writing. Transform dull sentences into sophisticated, professional copy.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                
                    <div style="margin-bottom: 1rem;">
                        <label style="display:block; margin-bottom: 0.35rem; font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Optimization Focus:</label>
                        <select id="focus" class="setting-control" style="width: 100%; padding: 0.6rem; border-radius: 8px;">
                            <option value="clarity">High Clarity & Fluency</option>
                            <option value="concise">Concise & Punchy</option>
                            <option value="formal">Academic & Corporate</option>
                            <option value="engaging">Engaging & Creative</option>
                        </select>
                    </div>
                <div class="writer-panel">
                    <div>
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700;">Original Draft</label>
                        <textarea id="sourceText" placeholder="Paste your draft here..."></textarea>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700; color: var(--primary);">Improved Result</label>
                        <textarea id="targetText" readonly placeholder="Result will appear here..."></textarea>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-primary" id="improveBtn" style="padding: 1rem 3rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Improve Content</button>
                    <div id="loader" style="display: none; font-size: 0.9rem; color: var(--text-muted);">
                        <i class="fas fa-magic fa-spin"></i> Refining prose...
                    </div>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('improveBtn');
        const loader = document.getElementById('loader');
        const source = document.getElementById('sourceText');
        const target = document.getElementById('targetText');

        btn.onclick = () => {
            if(!source.value.trim()) return;
            
            loader.style.display = 'block';
            target.value = "Scanning for improvements...";
            
            setTimeout(() => {
                const text = source.value;
                const focus = document.getElementById('focus').value;
                
                let result = text
                    .replace(/\bis\b/g, "represents")
                    .replace(/\bvery\b/g, "profoundly")
                    .replace(/\bbig\b/g, "substantial")
                    .replace(/\bbad\b/g, "suboptimal")
                    .replace(/\bdo\b/g, "facilitate");

                if(focus === 'concise') {
                    result = result.substring(0, Math.floor(result.length * 0.8)) + "...";
                }

                target.value = result + "\n\n[PRO TIP: We've refined the vocabulary to enhance the " + focus + " tone of your draft.]";
                loader.style.display = 'none';
            }, 1800);
        };
    </script>
</body>
</html>
