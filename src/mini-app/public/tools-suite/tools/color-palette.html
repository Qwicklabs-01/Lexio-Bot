<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator - Universal Studio</title>
    <meta name="description" content="Generate professionally balanced color schemes for your apps and websites.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Color Palette Generator</h1>
            <p>Generate professionally balanced color schemes for your apps and websites.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="palette-grid" id="paletteGrid">
                    <!-- Dynamic Slots -->
                    <div class="color-slot" style="background: #6366f1;"><span class="color-code">#6366F1</span></div>
                    <div class="color-slot" style="background: #8b5cf6;"><span class="color-code">#8B5CF6</span></div>
                    <div class="color-slot" style="background: #d946ef;"><span class="color-code">#D946EF</span></div>
                    <div class="color-slot" style="background: #f43f5e;"><span class="color-code">#F43F5E</span></div>
                    <div class="color-slot" style="background: #fb923c;"><span class="color-code">#FB923C</span></div>
                </div>

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn-primary" id="genBtn" style="padding: 1rem 2rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Generate New Palette</button>
                    <button class="btn-primary" style="padding: 1rem 2rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 0.5rem; cursor: pointer;">Export CSS Variables</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const genBtn = document.getElementById('genBtn');
        const grid = document.getElementById('paletteGrid');

        function generateRandomHex() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        genBtn.onclick = () => {
            const slots = grid.querySelectorAll('.color-slot');
            slots.forEach(slot => {
                const hex = generateRandomHex();
                slot.style.background = hex;
                slot.querySelector('.color-code').textContent = hex;
            });
        };
    </script>
</body>
</html>
