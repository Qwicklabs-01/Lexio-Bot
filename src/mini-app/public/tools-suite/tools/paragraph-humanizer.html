<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Humanizer - Universal Studio</title>
    <meta name="description" content="Break the bot. Convert robotic AI text into natural, engaging, and human-like prose.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Paragraph Humanizer</h1>
            <p>Break the bot. Convert robotic AI text into natural, engaging, and human-like prose.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">

                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.35rem; font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Humanizer Nuance:</label>
                    <select id="nuance" class="setting-control" style="width: 100%; padding: 0.6rem; border-radius: 8px;">
                        <option value="conversational">Conversational & Natural</option>
                        <option value="storyteller">Storyteller Narrative</option>
                        <option value="professional">Approachable Professional</option>
                    </select>
                </div>
                <div class="humanizer-panel">
                    <div>
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700;">AI Output / Draft</label>
                        <textarea id="aiText" placeholder="Paste your robotic or AI-generated text here..."></textarea>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom: 0.5rem; font-weight: 700; color: #10b981;">Humanized Result</label>
                        <textarea id="humanText" readonly placeholder="Natural result will appear here..."></textarea>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-primary" id="humanizeBtn" style="padding: 1rem 3rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Humanize Text</button>
                    <div id="loader" style="display: none; font-size: 0.9rem; color: var(--text-muted);">
                        <i class="fas fa-user fa-spin"></i> Adding emotional nuance...
                    </div>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('humanizeBtn');
        const loader = document.getElementById('loader');
        const source = document.getElementById('aiText');
        const target = document.getElementById('humanText');

        btn.onclick = () => {
            if(!source.value.trim()) return;
            
            loader.style.display = 'block';
            target.value = "Analyzing linguistic patterns...";
            
            setTimeout(() => {
                const text = source.value;
                const nuance = document.getElementById('nuance').value;
                
                let result = text
                    .replace(/\bis\b/g, "actually feels like")
                    .replace(/\bimportant\b/g, "crucial for our success")
                    .replace(/\bvery\b/g, "honestly quite")
                    .replace(/\bI think\b/g, "If you ask me, I'd say")
                    .replace(/\bIt is\b/g, "It's")
                    .replace(/\bDo not\b/g, "Don't");

                if(nuance === 'storyteller') {
                    result = "Picture this: " + result.toLowerCase();
                }

                target.value = result;
                loader.style.display = 'none';
            }, 2000);
        };
    </script>
</body>
</html>
