<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Generator - Universal Studio</title>
    <meta name="description" content="Design modern, frosted-glass UI components with deep blur and translucent borders.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Glassmorphism Generator</h1>
            <p>Design modern, frosted-glass UI components with deep blur and translucent borders.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div style="background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&q=80&w=1000') center/cover; padding: 5rem; border-radius: 1rem; margin-bottom: 2rem;">
                    <div id="glassBox" style="width: 200px; height: 200px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-weight: 800; color: white; border-radius: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">PREVIEW</div>
                </div>

                <div class="controls" style="display: grid; gap: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Blur Intensity</label>
                        <input type="range" id="blur" min="0" max="40" value="12">
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Transparency</label>
                        <input type="range" id="opacity" min="0" max="100" value="20">
                    </div>
                </div>

                <div class="css-output" style="margin-top: 2rem; background: var(--surface); padding: 1.5rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                    <code id="cssCode">/* CSS Logic */</code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const glass = document.getElementById('glassBox');
        const blurInput = document.getElementById('blur');
        const opacityInput = document.getElementById('opacity');
        const codeOutput = document.getElementById('cssCode');

        function updateGlass() {
            const blur = blurInput.value;
            const op = opacityInput.value / 100;
            const style = `
background: rgba(255, 255, 255, ${op});
backdrop-filter: blur(${blur}px);
-webkit-backdrop-filter: blur(${blur}px);
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 1.5rem;`;
            
            glass.style.background = `rgba(255, 255, 255, ${op})`;
            glass.style.backdropFilter = `blur(${blur}px)`;
            glass.style.webkitBackdropFilter = `blur(${blur}px)`;
            glass.style.border = `1px solid rgba(255, 255, 255, 0.3)`;
            
            codeOutput.innerHTML = style.replace(/\n/g, '<br>');
        }

        blurInput.oninput = updateGlass;
        opacityInput.oninput = updateGlass;
        updateGlass();
    </script>
</body>
</html>
