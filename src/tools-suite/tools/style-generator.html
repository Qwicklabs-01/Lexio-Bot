<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Design Generator - Universal Studio</title>
    <meta name="description" content="Create professional layer effects similar to Adobe Photoshop directly in your browser.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Style Design Generator</h1>
            <p>Create professional layer effects similar to Adobe Photoshop directly in your browser.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="style-preview-container">
                    <div id="previewBox">ABC</div>
                </div>

                <div class="controls-stacked">
                    <div class="control-row">
                        <label>Base Color</label>
                        <input type="color" id="baseColor" value="#ffffff">
                    </div>
                    <div class="control-row">
                        <label>Shadow Blur</label>
                        <input type="range" id="shadowBlur" min="0" max="50" value="10">
                    </div>
                    <div class="control-row">
                        <label>Shadow Spread</label>
                        <input type="range" id="shadowSpread" min="-20" max="30" value="0">
                    </div>
                    <div class="control-row">
                        <label>Shadow Color</label>
                        <input type="color" id="shadowColor" value="#000000">
                    </div>
                    <div class="control-row">
                        <label>Border Radius</label>
                        <input type="range" id="borderRadius" min="0" max="75" value="16">
                    </div>
                </div>

                <div class="css-output-box" style="margin-top: 2rem;">
                    <code id="styleCss">/* CSS Style Code */</code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const preview = document.getElementById('previewBox');
        const styleCode = document.getElementById('styleCss');
        
        const inputs = [
            document.getElementById('baseColor'),
            document.getElementById('shadowBlur'),
            document.getElementById('shadowSpread'),
            document.getElementById('shadowColor'),
            document.getElementById('borderRadius')
        ];

        function updateStyle() {
            const color = inputs[0].value;
            const blur = inputs[1].value;
            const spread = inputs[2].value;
            const sColor = inputs[3].value;
            const radius = inputs[4].value;

            const shadow = `0 ${blur/2}px ${blur}px ${spread}px ${sColor}`;
            
            preview.style.backgroundColor = color;
            preview.style.boxShadow = shadow;
            preview.style.borderRadius = `${radius}px`;

            styleCode.innerHTML = `background-color: ${color};<br>box-shadow: ${shadow};<br>border-radius: ${radius}px;`;
        }

        inputs.forEach(i => i.addEventListener('input', updateStyle));

        const tplData = {
            glass: { color: 'rgba(255,255,255,0.7)', blur: 20, spread: 0, sColor: 'rgba(0,0,0,0.1)', radius: 20 },
            neo: { color: '#e0e0e0', blur: 30, spread: 0, sColor: '#bebebe', radius: 30 },
            glossy: { color: '#6366f1', blur: 40, spread: -10, sColor: '#4338ca', radius: 10 }
        };

        document.querySelectorAll('.tpl-btn').forEach(btn => {
            btn.onclick = () => {
                const data = tplData[btn.dataset.tpl];
                inputs[0].value = data.color.startsWith('rgba') ? '#ffffff' : data.color;
                inputs[1].value = data.blur;
                inputs[2].value = data.spread;
                inputs[4].value = data.radius;
                updateStyle();
                if(data.color.startsWith('rgba')) preview.style.backgroundColor = data.color;
            }
        });

        updateStyle();
    </script>
</body>
</html>
