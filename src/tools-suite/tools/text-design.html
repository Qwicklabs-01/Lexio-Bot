<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Design Generator - Universal Studio</title>
    <meta name="description" content="Design beautiful text effects with gradients, outlines, and shadows instantly.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Text Design Generator</h1>
            <p>Design beautiful text effects with gradients, outlines, and shadows instantly.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="text-preview-canvas">
                    <div id="previewText">DESIGN</div>
                </div>

                <div class="controls-grid">
                    <div class="control-item" style="grid-column: 1 / -1;">
                        <label>Your Text</label>
                        <input type="text" id="userInput" value="DESIGN" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
                    </div>
                    <div class="control-item">
                        <label>Start Color</label>
                        <input type="color" id="color1" value="#3b82f6">
                    </div>
                    <div class="control-item">
                        <label>End Color</label>
                        <input type="color" id="color2" value="#8b5cf6">
                    </div>
                    <div class="control-item">
                        <label>Shadow Blur</label>
                        <input type="range" id="shadow" min="0" max="50" value="10" style="width:100%;">
                    </div>
                    <div class="control-item">
                        <label>Font Size</label>
                        <input type="range" id="fontSize" min="20" max="150" value="70" style="width:100%;">
                    </div>
                </div>

                <div class="css-output-box" style="margin-top: 2rem;">
                    <button class="copy-code-btn" id="copyBtn" style="position: absolute; right: 1rem; top: 0.5rem; padding: 0.25rem 0.75rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer;">Copy CSS</button>
                    <code id="cssOutput" style="font-size: 0.8rem; word-break: break-all;"></code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const preview = document.getElementById('previewText');
        const input = document.getElementById('userInput');
        const c1 = document.getElementById('color1');
        const c2 = document.getElementById('color2');
        const shadow = document.getElementById('shadow');
        const fSize = document.getElementById('fontSize');
        const cssOut = document.getElementById('cssOutput');

        function update() {
            preview.textContent = input.value;
            preview.style.fontSize = fSize.value + 'px';
            const s = shadow.value;
            preview.style.textShadow = `0 ${s/2}px ${s}px rgba(0,0,0,0.3)`;
            
            // Gradient Logic
            preview.style.background = `linear-gradient(to right, ${c1.value}, ${c2.value})`;
            preview.style.webkitBackgroundClip = 'text';
            preview.style.webkitTextFillColor = 'transparent';

            const css = `font-size: ${fSize.value}px;\nbackground: linear-gradient(to right, ${c1.value}, ${c2.value});\n-webkit-background-clip: text;\n-webkit-text-fill-color: transparent;\ntext-shadow: 0 ${s/2}px ${s}px rgba(0,0,0,0.3);`;
            cssOut.innerHTML = css.replace(/\n/g, '<br>');
        }

        [input, c1, c2, shadow, fSize].forEach(el => el.addEventListener('input', update));

        document.getElementById('copyBtn').onclick = () => {
            const el = document.createElement('textarea');
            el.value = cssOut.textContent;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('CSS Copied!');
        };

        update();
    </script>
</body>
</html>
