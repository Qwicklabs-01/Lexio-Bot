<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator - Universal Studio</title>
    <meta name="description" content="Design stunning background gradients and get instant CSS code for your projects.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Gradient Generator</h1>
            <p>Design stunning background gradients and get instant CSS code for your projects.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div id="preview" class="gradient-preview"></div>
                
                <div class="controls-grid">
                    <div class="control-group">
                        <label>Start Color</label>
                        <input type="color" id="color1" value="#6366f1">
                    </div>
                    <div class="control-group">
                        <label>End Color</label>
                        <input type="color" id="color2" value="#a855f7">
                    </div>
                    <div class="control-group">
                        <label>Angle (0Â° - 360Â°)</label>
                        <input type="range" id="angle" min="0" max="360" value="135">
                    </div>
                    <div class="control-group">
                        <label>Gradient Type</label>
                        <select id="type" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
                            <option value="linear">Linear</option>
                            <option value="radial">Radial</option>
                        </select>
                    </div>
                </div>

                <div class="css-output-box">
                    <button class="copy-code-btn" id="copyCode">Copy CSS</button>
                    <code id="cssCode">background: linear-gradient(135deg, #6366f1, #a855f7);</code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const angle = document.getElementById('angle');
        const type = document.getElementById('type');
        const preview = document.getElementById('preview');
        const cssCode = document.getElementById('cssCode');
        const copyBtn = document.getElementById('copyCode');

        function updateGradient() {
            let gradString = "";
            if(type.value === 'linear') {
                gradString = `linear-gradient(${angle.value}deg, ${color1.value}, ${color2.value})`;
            } else {
                gradString = `radial-gradient(circle, ${color1.value}, ${color2.value})`;
            }
            
            preview.style.background = gradString;
            cssCode.textContent = `background: ${gradString};`;
        }

        [color1, color2, angle, type].forEach(el => el.addEventListener('input', updateGradient));

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                color1.value = btn.dataset.c1;
                color2.value = btn.dataset.c2;
                updateGradient();
            });
        });

        copyBtn.onclick = () => {
            const range = document.createRange();
            range.selectNode(cssCode);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy CSS', 2000);
        };

        updateGradient();
    </script>
</body>
</html>
