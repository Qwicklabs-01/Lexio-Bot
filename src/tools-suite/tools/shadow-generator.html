<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow Generator - Universal Studio</title>
    <meta name="description" content="Master the art of depth. Create multi-layered shadows for clean, premium interfaces.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Box Shadow Generator</h1>
            <p>Master the art of depth. Create multi-layered shadows for clean, premium interfaces.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div style="height: 250px; display: flex; align-items: center; justify-content: center; background: var(--surface); border-radius: 1rem; margin-bottom: 2rem; border: 1px solid var(--border);">
                    <div id="shadowBox" style="width: 120px; height: 120px; background: white; border-radius: 1rem;"></div>
                </div>

                <div class="controls" style="display: grid; gap: 1rem;">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Blur</label>
                        <input type="range" id="b" min="0" max="100" value="30">
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <label>Spread</label>
                        <input type="range" id="s" min="-20" max="20" value="0">
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <label>Opacity</label>
                        <input type="range" id="o" min="0" max="100" value="10">
                    </div>
                </div>

                <div class="css-output" style="margin-top: 2rem; background: var(--surface); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                    <code id="cssCode">/* Shadow Path */</code>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const box = document.getElementById('shadowBox');
        const b = document.getElementById('b');
        const s = document.getElementById('s');
        const o = document.getElementById('o');
        const code = document.getElementById('cssCode');

        function update() {
            const val = `box-shadow: 0 10px ${b.value}px ${s.value}px rgba(0, 0, 0, ${o.value/100});`;
            box.style.boxShadow = `0 10px ${b.value}px ${s.value}px rgba(0, 0, 0, ${o.value/100})`;
            code.textContent = val;
        }

        b.oninput = update;
        s.oninput = update;
        o.oninput = update;
        update();
    </script>
</body>
</html>
