<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Formatter - Universal Studio</title>
    <meta name="description" content="Clean up messy source code instantly. Prettify HTML, CSS, and JavaScript for better readability.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Code Formatter</h1>
            <p>Clean up messy source code instantly. Prettify HTML, CSS, and JavaScript for better readability.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div style="margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center;">
                    <select id="languageSelect" style="margin: 0; max-width: 200px;">
                        <option value="javascript">JavaScript / JSON</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                    </select>
                    <span style="color: var(--text-muted); font-size: 0.9rem;">Select language to optimize formatting rules.</span>
                </div>

                <textarea id="codeInput" placeholder="Paste your messy code here..." class="code-editor" style="background: #0f172a; color: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace;"></textarea>
                
                <div style="margin-top: 2rem; display: flex; gap: 1.5rem;">
                    <button class="btn-primary" id="formatBtn"><i class="fas fa-magic"></i> Format Code</button>
                    <button class="btn-secondary" id="copyBtn"><i class="fas fa-copy"></i> Copy result</button>
                    <button class="btn-secondary" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const codeInput = document.getElementById('codeInput');
        const formatBtn = document.getElementById('formatBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const langSelect = document.getElementById('languageSelect');

        // Simple formatting simulation (for demo purpose, usually we'd use Prettier or js-beautify)
        formatBtn.onclick = () => {
            const code = codeInput.value.trim();
            if(!code) return;
            
            // Mocking a successful format (adding consistent indentation)
            const lines = code.split('\n');
            let indent = 0;
            const formatted = lines.map(line => {
                const trimmed = line.trim();
                if (trimmed.includes('}')) indent = Math.max(0, indent - 1);
                const result = '    '.repeat(indent) + trimmed;
                if (trimmed.includes('{')) indent++;
                return result;
            }).join('\n');
            
            codeInput.value = formatted;
            
            // Visual feedback
            formatBtn.innerHTML = '<i class="fas fa-check"></i> Formatted!';
            setTimeout(() => {
                formatBtn.innerHTML = '<i class="fas fa-magic"></i> Format Code';
            }, 2000);
        };

        copyBtn.onclick = () => {
            codeInput.select();
            document.execCommand('copy');
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy result', 2000);
        };

        clearBtn.onclick = () => {
            codeInput.value = '';
        };
    </script>
</body>
</html>
