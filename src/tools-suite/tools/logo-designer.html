<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Logo Designer - Universal Studio</title>
    <meta name="description" content="Define your brand identity in seconds. Professional, vector-ready logos tailored to your vision.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Expert Logo Designer</h1>
            <p>Define your brand identity in seconds. Professional, vector-ready logos tailored to your vision.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">
                <div class="logo-preview-box" id="logoPreview">
                    <div id="logoIcon"><i class="fas fa-rocket"></i></div>
                    <div id="logoText">BRANDNAME</div>
                </div>

                <div class="logo-controls">
                    <div class="input-field">
                        <label style="display: block; font-weight: 700; margin-bottom: 0.75rem; font-size: 0.9rem; text-transform: uppercase;">Company Name</label>
                        <input type="text" id="brandInput" placeholder="Enter your business name..." style="margin: 0;">
                    </div>
                    
                    <div class="controls-inner">
                        <div class="select-field">
                            <label style="display: block; font-weight: 700; margin-bottom: 0.75rem; font-size: 0.9rem; text-transform: uppercase;">Industry</label>
                            <select id="industry" style="margin: 0;">
                                <option value="tech">Technology & AI</option>
                                <option value="store">Modern Retail</option>
                                <option value="food">Gourmet & Dining</option>
                                <option value="art">Creative Media</option>
                            </select>
                        </div>
                        <div class="button-field" style="display: flex; align-items: flex-end;">
                            <button class="btn-primary" id="genBtn" style="width: 100%;">
                                <i class="fas fa-magic"></i> Generate Brand
                            </button>
                        </div>
                    </div>
                </div>
                
                <div style="margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
                    <button class="btn-secondary" id="downloadBtn"><i class="fas fa-download"></i> Download PNG</button>
                    <button class="btn-secondary"><i class="fas fa-file-export"></i> Export SVG</button>
                </div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const icons = {
            tech: ['fa-microchip', 'fa-code', 'fa-server', 'fa-robot', 'fa-network-wired'],
            store: ['fa-shopping-bag', 'fa-tag', 'fa-cart-shopping', 'fa-store', 'fa-credit-card'],
            food: ['fa-utensils', 'fa-mug-hot', 'fa-pizza-slice', 'fa-burger', 'fa-drumstick-bite'],
            art: ['fa-palette', 'fa-paint-brush', 'fa-pen-nib', 'fa-camera-retro', 'fa-bezier-curve']
        };

        const btn = document.getElementById('genBtn');
        const iconDiv = document.getElementById('logoIcon');
        const textDiv = document.getElementById('logoText');
        const brandIn = document.getElementById('brandInput');
        const indIn = document.getElementById('industry');
        const preview = document.getElementById('logoPreview');

        btn.onclick = () => {
            const list = icons[indIn.value];
            const icon = list[Math.floor(Math.random() * list.length)];
            
            // Minimal animation transition
            preview.style.transform = 'scale(0.95)';
            preview.style.opacity = '0.5';
            
            setTimeout(() => {
                iconDiv.innerHTML = `<i class="fas ${icon}"></i>`;
                textDiv.textContent = brandIn.value || "BRANDNAME";
                
                const colors = ['#230046', '#003a2f', '#4a0000', '#00264d', '#3d2b1f', '#0f172a'];
                const accentColors = ['#6366f1', '#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#ec4899'];
                
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const randomAccent = accentColors[Math.floor(Math.random() * accentColors.length)];
                
                textDiv.style.color = randomColor;
                iconDiv.style.color = randomAccent;
                
                preview.style.transform = 'scale(1)';
                preview.style.opacity = '1';
            }, 300);
        };
    </script>
</body>
</html>
