<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Completer - Universal Studio</title>
    <meta name="description" content="Don't stop now. Let the AI predict the next steps in your narrative or argument.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <header class="tool-nav-bar">
        <a href="../index.html" class="tool-nav-btn"><i class="fas fa-arrow-left"></i> <span>All Tools</span></a>
        <div class="tool-brand-tag">
            <span class="tool-status-dot"></span>
            <span>Client-Side Engine</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>


    <div class="tool-header"><div class="container"><h1>Paragraph Completer</h1>
            <p>Don't stop now. Let the AI predict the next steps in your narrative or argument.</p>
        </div>
    </div>

    <main class="container">
        <div class="tool-container">
            <div class="tool-app glass">

                <div style="margin-bottom: 1rem;">
                    <label style="display:block; margin-bottom: 0.35rem; font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Completion Tone:</label>
                    <select id="tone" class="setting-control" style="width: 100%; padding: 0.6rem; border-radius: 8px;">
                        <option value="conclusive">Conclusive & Decisive</option>
                        <option value="exploratory">Exploratory & Open-ended</option>
                        <option value="skeptical">Critical & Analytical</option>
                    </select>
                </div>
                <textarea id="userInput" placeholder="Start your paragraph here (e.g. In conclusion, the transition to renewable energy...)"></textarea>
                
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
                    <button class="btn-primary" id="completeBtn" style="padding: 1rem 3rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 700;">Complete Paragraph</button>
                    <div id="loader" style="display: none;"><i class="fas fa-brain fa-spin"></i> Analyzing context...</div>
                </div>

                <div id="resultArea"></div>
            </div>

            <aside class="tool-sidebar glass"><h4><i class="fas fa-cog"></i> Tool Settings</h4><div class="setting-group"><label>Priority Mode</label><select class="setting-control"><option>Balanced Performance</option><option>High Speed</option><option>Maximum Quality</option></select></div><div class="setting-group"><label>Export Format</label><select class="setting-control"><option>Default (.txt / .png)</option><option>Structured JSON</option><option>Rich Text (PDF)</option></select></div><button class="btn-primary">Execute Operation</button><p style="margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;"><i class="fas fa-shield-alt"></i> 100% Secure & Local</p></aside>
        </div>

        
    </main>

    

        <footer class="tool-compact-footer">
        <div class="container">
            <span>🔒 100% Private & Local Processing • No Cloud Storage</span>
        </div>
    </footer>
<script src="../js/main.js"></script>
    <script>
        const btn = document.getElementById('completeBtn');
        const loader = document.getElementById('loader');
        const input = document.getElementById('userInput');
        const result = document.getElementById('resultArea');

        btn.onclick = () => {
            if(!input.value.trim()) return;
            
            loader.style.display = 'block';
            btn.disabled = true;
            result.style.display = 'none';

            setTimeout(() => {
                const text = input.value;
                const tone = document.getElementById('tone').value;
                
                let completion = "";
                if(tone === 'conclusive') {
                    completion = "\n\nUltimately, this suggests that the path forward requires a balanced approach. By integrating these various perspectives, we can achieve a outcome that is both sustainable and impactful for all stakeholders involved.";
                } else if(tone === 'exploratory') {
                    completion = "\n\nThis leads us to several interesting questions. Moving forward, it will be essential to investigate the secondary effects of this trend to fully understand the long-term implications for the industry at large.";
                } else {
                    completion = "\n\nHowever, we must remain skeptical of these initial findings. A deeper dive into the raw data reveals inconsistencies that suggest the prevailing narrative may be oversimplified or missing key contextual nuances.";
                }

                result.innerHTML = `<strong>Suggested Completion:</strong><br>${completion}`;
                result.style.display = 'block';
                loader.style.display = 'none';
                btn.disabled = false;
            }, 1800);
        };
    </script>
</body>
</html>
