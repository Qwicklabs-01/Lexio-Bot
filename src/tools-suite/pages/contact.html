<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Universal Studio - We're Here to Help</title>
    <meta name="description" content="Get in touch with the Universal Studio team. Have questions about our 60+ online tools or need technical support? Send us a message today.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/tool-styles.css">
</head>
<body>
    <header>
        <div class="container nav-wrapper">
            <a href="../index.html" class="logo">Universal Studio</a>
            <div class="nav-actions">
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="container page-content">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; padding: 4rem 0;">
            <section>
                <h1 style="font-size: 3rem; margin-bottom: 1.5rem;">Let's talk.</h1>
                <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 2rem;">Have a feature request or need help with a conversion? Our team is available 24/7 to ensure your productivity never stops.</p>
                
                <div style="display: flex; flex-direction: column; gap: 2rem; margin-top: 3rem;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="width: 50px; height: 50px; background: rgba(var(--primary-h), var(--primary-s), 95%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div>
                            <h4 style="margin-bottom: 0px;">Email Support</h4>
                            <p style="color: var(--text-muted); font-size: 0.9rem;">support@toolforge.io</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass" style="padding: 3rem;">
                <form id="contactForm" onsubmit="return false;" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="input-field">
                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Full Name</label>
                            <input type="text" placeholder="John Doe" style="width: 100%; padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text);">
                        </div>
                        <div class="input-field">
                            <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Email Address</label>
                            <input type="email" placeholder="john@example.com" style="width: 100%; padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text);">
                        </div>
                    </div>
                    
                    <div class="input-field">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Message</label>
                        <textarea placeholder="Tell us more about your request..." style="width: 100%; height: 150px; padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: none;"></textarea>
                    </div>

                    <button class="btn-premium" style="width: 100%;">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Universal Studio. Pro-Level Communication.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
